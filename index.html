<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thought Record</title>
<meta name="theme-color" content="#b8336a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thought Record">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: one plain column — top bar, records list, one form screen; a lock screen covers everything until the password is entered. */
:root {
  --bg: #f4f3f7;
  --surface: #ffffff;
  --ink: #23202e;
  --muted: #6c6779;
  --line: #e2dee9;
  --accent: #b8336a;
  --accent-soft: #f7e3ec;
  --accent-ink: #ffffff;
  --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17151d; --surface: #221f2b; --ink: #ece9f2; --muted: #a39db1; --line: #34303f;
    --accent: #e8689c; --accent-soft: #3d2231; --accent-ink: #1a0f15; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17151d; --surface: #221f2b; --ink: #ece9f2; --muted: #a39db1; --line: #34303f;
  --accent: #e8689c; --accent-soft: #3d2231; --accent-ink: #1a0f15; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; display: flex; flex-direction: column; gap: 16px; }
.bar { display: flex; align-items: center; gap: 8px; }
.bar h1 { font-size: 1.4rem; margin: 0; flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; font-weight: 700; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-text { border: 0; background: none; color: var(--muted); padding: 10px 8px; font-weight: 700; }
.btn-block { width: 100%; padding: 14px; font-size: 1.05rem; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }

.entry { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 6px; text-align: left; width: 100%; }
.entry small { color: var(--muted); font-variant-numeric: tabular-nums; }
.entry p { margin: 0; overflow-wrap: anywhere; }
.entry .t { color: var(--accent); font-style: italic; }
.entry .m { color: var(--muted); font-size: 0.93rem; }
.empty { color: var(--muted); text-align: center; padding: 24px 12px; border: 1px dashed var(--line); border-radius: 12px; }
.empty p { margin: 0 0 6px; }

form { display: grid; gap: 14px; }
label { font-weight: 700; display: block; margin-bottom: 4px; }
label span { font-weight: 400; color: var(--muted); }
textarea, input[type="text"], input[type="password"], input[type="number"], input[type="datetime-local"] {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
}
textarea { min-height: 84px; resize: vertical; }
.emo { display: grid; grid-template-columns: 1fr 5.5rem 2.5rem; gap: 8px; align-items: center; }
.emo input[type="number"] { text-align: center; font-variant-numeric: tabular-nums; }
.emo button { height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; color: var(--muted); }
.emo-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.emo-chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 0.88rem; }
.emo-chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.hint { color: var(--muted); font-size: 0.85rem; margin: 4px 0 0; }
.err { color: var(--accent); margin: 0; font-weight: 700; }
.confirm { background: var(--accent-soft); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }

.lock { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px 16px; padding-top: calc(24px + env(safe-area-inset-top, 0px)); }
.lock-box { width: 100%; max-width: 360px; display: grid; gap: 14px; text-align: center; }
.lock-icon { width: 56px; height: 56px; margin: 0 auto; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; }
.lock-box h2 { margin: 0; font-size: 1.35rem; }
.lock-box p { margin: 0; color: var(--muted); }
.lock-box form { text-align: left; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 0.9rem; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
</style>

<!-- Lock screen: shown on every open and whenever the app is left -->
<div class="lock" id="lock">
  <div class="lock-box">
    <div class="lock-icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent)"><rect x="5" y="11" width="14" height="10" rx="2" fill="none"/><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none"/></svg>
    </div>
    <h2 id="lock-title">Thought Record</h2>
    <p id="lock-sub">Loading…</p>
    <form id="lock-form" hidden>
      <div>
        <label for="uid" id="uid-label">User ID</label>
        <input type="text" id="uid" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="40">
      </div>
      <div>
        <label for="pw1" id="pw1-label">Password</label>
        <input type="password" id="pw1" autocomplete="current-password">
      </div>
      <div id="pw2-wrap" hidden>
        <label for="pw2">Repeat password</label>
        <input type="password" id="pw2" autocomplete="new-password">
      </div>
      <p class="err" id="lock-err" hidden></p>
      <button class="btn btn-primary btn-block" id="lock-btn">Unlock</button>
    </form>
  </div>
</div>

<div class="wrap" id="home" hidden>
  <div class="bar">
    <h1>Thought Record</h1>
    <button class="btn-text" id="lock-now">Lock</button>
  </div>
  <div class="row">
    <button class="btn btn-primary" id="new-btn">+ New record</button>
    <button class="btn" id="pdf-btn">Download PDF</button>
  </div>
  <div id="list" style="display:grid;gap:10px"></div>
</div>

<div class="wrap" id="editor" hidden>
  <div class="bar">
    <button class="btn-text" id="ed-cancel">← Back</button>
    <h1 id="ed-title" style="text-align:center">New record</h1>
    <span style="width:60px"></span>
  </div>
  <form id="ed-form" novalidate>
    <div>
      <label for="f-when">Date</label>
      <input type="datetime-local" id="f-when">
    </div>
    <div>
      <label for="f-sit">Situation <span>· What happened?</span></label>
      <textarea id="f-sit" placeholder="Got a short reply from a friend"></textarea>
    </div>
    <div>
      <label for="f-thought">Automatic thought <span>· What went through your mind?</span></label>
      <textarea id="f-thought" placeholder="They’re upset with me. I did something wrong."></textarea>
    </div>
    <div>
      <label>Emotion(s) <span>· What did you feel? Tap all that fit, then rate 0–100</span></label>
      <div class="emo-chips" id="emo-chips"></div>
      <div id="emos" style="display:grid;gap:8px"></div>
      <button type="button" class="btn-text" id="emo-add" style="padding-left:0">+ Add emotion</button>
    </div>
    <div>
      <label for="f-beh">Behavior / reaction <span>· What did you do or avoid doing?</span></label>
      <textarea id="f-beh" placeholder="Overthought for hours, didn’t reply back"></textarea>
    </div>
    <p class="err" id="ed-err" hidden></p>
    <button class="btn btn-primary btn-block" id="ed-save">Save</button>
    <div id="del-wrap"></div>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const LS_RECORDS = "thought-records-v1", LS_LOCK = "thought-records-lock";
  const LOCK_ID = "_lock";

  let records = [];
  let lockInfo = null;      // { salt, hash } or null when no password yet
  let unlocked = false;
  let store = null;
  let editing = null;

  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }

  // ---------- storage: private account storage, or this device as fallback ----------
  function lsGet(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  const localStore = {
    async loadLock() { return lsGet(LS_LOCK, null); },
    async saveLock(v) { lsSet(LS_LOCK, v); },
    subscribe(cb) { cb(lsGet(LS_RECORDS, [])); },
    async save(rec) { const l = lsGet(LS_RECORDS, []).filter(r => r.id !== rec.id); l.push(rec); lsSet(LS_RECORDS, l); records = l; renderList(); },
    async remove(id) { const l = lsGet(LS_RECORDS, []).filter(r => r.id !== id); lsSet(LS_RECORDS, l); records = l; renderList(); }
  };

  // Records stay on this phone only
  async function pickStore() { return localStore; }

  // ---------- password ----------
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function hashPw(pw, saltB64) {
    const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: unb64(saltB64), iterations: 150000, hash: "SHA-256" }, key, 256);
    return b64(bits);
  }

  function showLock() {
    unlocked = false;
    $("#home").hidden = true; $("#editor").hidden = true;
    $("#list").innerHTML = ""; editing = null;
    $("#lock").hidden = false;
    $("#lock-form").hidden = false;
    $("#lock-err").hidden = true;
    $("#pw1").value = ""; $("#pw2").value = "";
    const setup = !lockInfo, upgrade = !!lockInfo && !lockInfo.userId;
    $("#uid").value = "";
    $("#lock-sub").textContent = setup ? "Create a user ID and password. You’ll need them every time you open the app."
      : upgrade ? "Choose a user ID, then enter your current password." : "Log in to open your records.";
    $("#uid-label").textContent = setup || upgrade ? "Choose a user ID" : "User ID";
    $("#pw1-label").textContent = setup ? "New password" : upgrade ? "Current password" : "Password";
    $("#pw1").autocomplete = setup ? "new-password" : "current-password";
    $("#pw2-wrap").hidden = !setup;
    $("#lock-btn").textContent = setup ? "Create account" : upgrade ? "Save user ID" : "Log in";
  }

  $("#lock-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("#lock-err"), pw = $("#pw1").value, uid = $("#uid").value.trim().toLowerCase();
    err.hidden = true;
    const fail = (m) => { err.textContent = m; err.hidden = false; };
    if (!uid) return fail("Enter a user ID.");
    if (!lockInfo) {
      if (uid.length < 3) return fail("User ID needs at least 3 characters.");
      if (pw.length < 4) return fail("Password needs at least 4 characters.");
      if (pw !== $("#pw2").value) return fail("The two passwords don’t match.");
      const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
      const info = { userId: uid, salt, hash: await hashPw(pw, salt) };
      try { await store.saveLock(info); } catch { return fail("Couldn’t save. Check your connection."); }
      lockInfo = info;
      openApp(); toast("Account created");
    } else {
      $("#lock-btn").disabled = true;
      const pwOk = (await hashPw(pw, lockInfo.salt)) === lockInfo.hash;
      $("#lock-btn").disabled = false;
      if (!lockInfo.userId) {
        if (uid.length < 3) return fail("User ID needs at least 3 characters.");
        if (!pwOk) { $("#pw1").value = ""; return fail("Wrong password. Try again."); }
        const info = { ...lockInfo, userId: uid };
        try { await store.saveLock(info); } catch { return fail("Couldn’t save. Check your connection."); }
        lockInfo = info; openApp(); toast("User ID saved");
        return;
      }
      if (!pwOk || uid !== lockInfo.userId) { $("#pw1").value = ""; return fail("User ID or password is wrong."); }
      openApp();
    }
  });

  function openApp() { unlocked = true; $("#lock").hidden = true; showHome(); }
  $("#lock-now").onclick = showLock;
  // Lock again whenever the app is left (switching apps, closing the tab, turning off the screen)
  document.addEventListener("visibilitychange", () => { if (document.hidden && unlocked) showLock(); });
  window.addEventListener("pagehide", () => { if (unlocked) showLock(); });

  // ---------- list ----------
  const sorted = () => [...records].sort((a, b) => (b.when || "").localeCompare(a.when || ""));
  function fmtDate(iso, opts) { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString(undefined, opts || { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" }); }
  const emoText = (emos) => (emos || []).map(e => `${e.name} ${e.intensity}/100`).join(", ");

  function showHome() { $("#editor").hidden = true; $("#home").hidden = false; renderList(); window.scrollTo(0, 0); }
  function renderList() {
    if (!unlocked) return;
    const list = sorted();
    $("#list").innerHTML = list.length ? list.map(r => `
      <button class="entry" data-id="${esc(r.id)}">
        <small>${esc(fmtDate(r.when))}</small>
        <p><b>${esc(r.situation)}</b></p>
        ${r.thought ? `<p class="t">“${esc(r.thought)}”</p>` : ""}
        ${r.emotions?.length ? `<p class="m">${esc(emoText(r.emotions))}</p>` : ""}
        ${r.behavior ? `<p class="m">→ ${esc(r.behavior)}</p>` : ""}
      </button>`).join("")
      : `<div class="empty"><p>No records yet.</p><p>When you notice a strong emotion or reaction, pause and tap <b>+ New record</b>.</p></div>`;
    $("#list").querySelectorAll(".entry").forEach(b => b.onclick = () => openEditor(records.find(r => r.id === b.dataset.id)));
  }

  // ---------- editor ----------
  function toLocalInput(iso) { const d = iso ? new Date(iso) : new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }
  function emoRow(name = "", val = 50) {
    const div = document.createElement("div");
    div.className = "emo";
    const n = $("#emos").children.length;
    div.innerHTML = `<input type="text" placeholder="e.g. Anxiety" aria-label="Emotion" id="emo-n-${n}" value="${esc(name)}" maxlength="40">
      <input type="number" inputmode="numeric" min="0" max="100" step="5" aria-label="Intensity out of 100" id="emo-v-${n}" value="${val}">
      <button type="button" aria-label="Remove emotion">✕</button>`;
    div.querySelector("button").onclick = () => { div.remove(); if (!$("#emos").children.length) emoRow(); syncChips(); };
    div.querySelector('input[type="text"]').addEventListener("input", syncChips);
    $("#emos").appendChild(div);
  }
  $("#emo-add").onclick = () => emoRow();

  const EMOTIONS = ["Anxiety","Worry","Nervousness","Fear","Panic","Stress","Overwhelm","Restlessness",
    "Sadness","Hurt","Loneliness","Grief","Disappointment","Hopelessness","Helplessness","Numbness",
    "Anger","Irritation","Frustration","Resentment","Jealousy","Envy",
    "Guilt","Shame","Embarrassment","Regret","Insecurity","Worthlessness","Rejection","Confusion",
    "Calm","Relief","Hope","Happiness"];
  const rowNames = () => [...$("#emos").children].map(r => r.querySelector('input[type="text"]'));
  function syncChips() {
    const chosen = new Set(rowNames().map(i => i.value.trim().toLowerCase()));
    $("#emo-chips").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", chosen.has(b.dataset.n.toLowerCase())));
  }
  $("#emo-chips").innerHTML = EMOTIONS.map(n => `<button type="button" aria-pressed="false" data-n="${n}">${n}</button>`).join("");
  $("#emo-chips").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const name = b.dataset.n, inputs = rowNames();
    const found = inputs.find(i => i.value.trim().toLowerCase() === name.toLowerCase());
    if (found) { found.closest(".emo").remove(); if (!$("#emos").children.length) emoRow(); }
    else { const blank = inputs.find(i => !i.value.trim()); if (blank) blank.value = name; else emoRow(name); }
    syncChips();
  });

  function openEditor(rec) {
    editing = rec || null;
    $("#ed-title").textContent = rec ? "Edit record" : "New record";
    $("#f-when").value = toLocalInput(rec?.when);
    $("#f-sit").value = rec?.situation || "";
    $("#f-thought").value = rec?.thought || "";
    $("#f-beh").value = rec?.behavior || "";
    $("#emos").innerHTML = "";
    (rec?.emotions?.length ? rec.emotions : [{ name: "", intensity: 50 }]).forEach(e => emoRow(e.name, e.intensity));
    syncChips();
    $("#ed-err").hidden = true;
    $("#del-wrap").innerHTML = rec ? `<button type="button" class="btn-text" id="del-btn" style="color:var(--accent);width:100%">Delete this record</button>` : "";
    if (rec) $("#del-btn").onclick = askDelete;
    $("#home").hidden = true; $("#editor").hidden = false; window.scrollTo(0, 0);
  }
  $("#ed-cancel").onclick = showHome;
  $("#new-btn").onclick = () => openEditor();

  $("#ed-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const emotions = [...$("#emos").children].map(row => {
      const [n, v] = row.querySelectorAll("input");
      return { name: n.value.trim(), intensity: Math.max(0, Math.min(100, Math.round(+v.value || 0))) };
    }).filter(x => x.name);
    const rec = {
      id: editing?.id || "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      when: $("#f-when").value ? new Date($("#f-when").value).toISOString() : new Date().toISOString(),
      situation: $("#f-sit").value.trim(),
      thought: $("#f-thought").value.trim(),
      emotions,
      behavior: $("#f-beh").value.trim()
    };
    if (!rec.situation) { const er = $("#ed-err"); er.textContent = "Write what happened before saving."; er.hidden = false; $("#f-sit").focus(); return; }
    const btn = $("#ed-save"); btn.disabled = true; btn.textContent = "Saving…";
    try { await store.save(rec); showHome(); toast("Saved"); }
    catch { const er = $("#ed-err"); er.textContent = "Couldn’t save. Check your connection and try again."; er.hidden = false; }
    btn.disabled = false; btn.textContent = "Save";
  });

  function askDelete() {
    $("#del-wrap").innerHTML = `<div class="confirm"><span>Delete this record? This can’t be undone.</span>
      <div class="row"><button type="button" class="btn btn-primary" id="del-yes">Delete</button><button type="button" class="btn" id="del-no">Keep it</button></div></div>`;
    $("#del-no").onclick = () => openEditor(editing);
    $("#del-yes").onclick = async () => { try { await store.remove(editing.id); showHome(); toast("Deleted"); } catch { toast("Couldn’t delete. Try again."); } };
  }

  // ---------- PDF ----------
  const pdfSafe = (s) => String(s || "").replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ‘’“”–—…•]/g, "");
  $("#pdf-btn").onclick = async () => {
    if (!unlocked) return;
    const list = sorted();
    if (!list.length) return toast("Add a record first, then download.");
    if (!window.jspdf?.jsPDF) return toast("PDF tool didn’t load. Reopen the app.");

    const doc = new jspdf.jsPDF({ orientation: "landscape", unit: "pt", format: "a4" });
    const W = doc.internal.pageSize.getWidth();
    doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.text("Thought Record Sheet", 40, 50);
    doc.setFont("helvetica", "italic"); doc.setFontSize(10); doc.setTextColor(100);
    doc.text("Track your thoughts, emotions, and reactions to understand your patterns and begin shifting them.", 40, 68);
    doc.setFont("helvetica", "normal");
    doc.text(`Exported ${fmtDate(new Date().toISOString(), { day: "numeric", month: "long", year: "numeric" })} · ${list.length} record${list.length > 1 ? "s" : ""}`, 40, 84);
    doc.autoTable({
      startY: 100,
      margin: { left: 40, right: 40 },
      head: [["Date & Situation", "Automatic Thought", "Emotion(s)", "Behavior / Reaction"]],
      body: list.map(r => [
        pdfSafe(`${fmtDate(r.when)}\n${r.situation}`),
        pdfSafe(r.thought ? `“${r.thought}”` : ""),
        pdfSafe((r.emotions || []).map(e => `${e.name} ${e.intensity}/100`).join("\n")),
        pdfSafe(r.behavior)
      ]),
      styles: { font: "helvetica", fontSize: 10, cellPadding: 8, valign: "top", lineColor: [220, 216, 228], lineWidth: 0.5 },
      headStyles: { fillColor: [184, 51, 106], textColor: 255, fontStyle: "bold" },
      alternateRowStyles: { fillColor: [248, 246, 250] },
      columnStyles: { 0: { cellWidth: (W - 80) * 0.26 }, 1: { cellWidth: (W - 80) * 0.28 }, 2: { cellWidth: (W - 80) * 0.18 }, 3: { cellWidth: (W - 80) * 0.28 } }
    });
    const name = `thought-record-${new Date().toISOString().slice(0, 10)}.pdf`;
    try { doc.save(name); toast("PDF downloaded"); }
    catch { toast("Couldn’t save the PDF. Try again."); }
  };

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  // ---------- start ----------
  (async () => {
    store = await pickStore();
    try { lockInfo = await store.loadLock(); } catch { lockInfo = null; }
    store.subscribe(list => { records = list; renderList(); });
    showLock();
    $("#uid").focus();
  })();
})();
</script>
</body>
</html>
